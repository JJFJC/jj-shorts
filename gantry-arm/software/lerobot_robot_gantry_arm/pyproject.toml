[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_gantry_arm"
version = "0.1.0"
description = "Gantry Arm (X/Z gantry + 5-DOF Feetech arm) as a LeRobot third-party robot plugin, with skills"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["lerobot>=0.6.1", "pyserial>=3.5", "numpy"]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
vision = ["opencv-contrib-python-headless>=4.9"]
plot = ["svgpathtools>=1.6"]
dev = ["pytest>=8", "mujoco>=3.2", "opencv-contrib-python-headless>=4.9", "svgpathtools>=1.6", "matplotlib"]

[project.scripts]
gantry-arm = "lerobot_robot_gantry_arm.cli:main"

[tool.setuptools.packages.find]
include = ["lerobot_robot_gantry_arm*"]

[tool.setuptools.package-data]
lerobot_robot_gantry_arm = ["assets/*"]

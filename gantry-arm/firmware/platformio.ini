; Gantry Arm gantry controller: ESP32 + 2x TMC2209 (UART) + WS2812 status LEDs
;   pio run -e esp32dev -t upload     build + flash
;   pio test -e native                run the core tests on the PC (no hardware)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
lib_deps =
    gin66/FastAccelStepper@^0.31.3
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit NeoPixel@^1.12.3

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
